<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eplicathon1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hero-card">

    <header class="navbar">
      <div class="logo">
        <img src="https://github.com/nycevents/replicathon1/blob/main/assets/logo.png?raw=true" alt="" class="logo-bracket">
        
      </div>

      <nav class="nav-links">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
      </nav>

      <button class="btn btn-place-order">
        Place order
        <img src="https://raw.githubusercontent.com/nycevents/replicathon1/7a217441301f841728467e9d743a8be1c038c188/assets/placeOrder.svg" alt="" class="icon-inline">
      </button>
    </header>
    <div class="tabs">
      <button class="tab tab-active">Products</button>
      <button class="tab">Custom</button>
    </div>

    <main class="content">

      <div class="left-panel">
        <h1>FIND YOUR <br> GREATNESS</h1>
        <p>
          Built for speed and confidence, every pair combines
          premium materials and bold design. Engineered for
          comfort, made for movement.
        </p>
      </div>

      <div class="center-panel">
        <h2 class="hype-text">
  <span class="hype-left">HY</span>
  <span class="hype-right">PE</span>
</h2>

<img src="https://github.com/nycevents/replicathon1/blob/main/assets/shoe.png?raw=true"
     alt="Orange and white sneaker"
     class="shoe-img">
    </div>

      <div class="right-panel">
        <p class="choose-label">Choose Your Color</p>
        <div class="color-options">
          <span class="color-dot" style="background:#2fc4c9"></span>
          <span class="color-dot color-dot--active" style="background:#f07c1a"></span>
          <span class="color-dot" style="background:#e8144f"></span>
        </div>

        <div class="size-options">
          <span class="size-circle">40</span>
          <span class="size-circle">42</span>
          <span class="size-circle">44</span>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="socials">
        <img src="https://raw.githubusercontent.com/nycevents/replicathon1/7a217441301f841728467e9d743a8be1c038c188/assets/instagram.svg" alt="Instagram">
        <img src="https://raw.githubusercontent.com/nycevents/replicathon1/7a217441301f841728467e9d743a8be1c038c188/assets/facebook.svg" alt="Facebook">
        <img src="https://raw.githubusercontent.com/nycevents/replicathon1/7a217441301f841728467e9d743a8be1c038c188/assets/pinterest.svg" alt="Pinterest">
        <img src="https://raw.githubusercontent.com/nycevents/replicathon1/7a217441301f841728467e9d743a8be1c038c188/assets/youtube.svg" alt="YouTube">
      </div>

      <p class="tagline">
        <span class="line"></span>
        SNEAKERS FOR MORE
        <span class="line"></span>
      </p>

      <button class="btn btn-see-all">
        See all products
        <img src="https://raw.githubusercontent.com/nycevents/replicathon1/7a217441301f841728467e9d743a8be1c038c188/assets/arrow.svg" alt="" class="icon-inline">
      </button>
    </footer>

  </div>

</body>
</html>
